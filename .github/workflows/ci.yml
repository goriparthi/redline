name: CI

# This workflow decides WHEN the checks run. What they are lives in scripts/ci.sh, so a
# laptop and a runner execute the identical code path and a CI failure can be reproduced
# with `make ci` rather than by pushing another commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      wack:
        description: "Run the Windows App Certification Kit against the MSIX"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # macOS runner: the app links AppKit and the tests need XCTest from Xcode
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run the check suite
        run: make ci

      # Kept as its own step so a failure here is obviously about the release gate rather
      # than about the build. Notes are required to release and only warned about here.
      - name: Release notes
        run: scripts/check-notes.sh --allow-missing

  # RedlineCore is Foundation only and has to keep building where there is no Xcode. These
  # jobs are the gate: a macOS-only API landing in the core fails here, not in a port months
  # later. Neither runner builds the app, because the app is AppKit and always will be.
  # Both publish the command line binary as an artifact, so "it builds" is something you can
  # download and run rather than something a log claims.
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Run the core tests
        run: swift test
      # Static, because a dynamically linked build needs the Swift runtime installed and
      # nobody downloading a CLI wants to install a toolchain first. libcurl stays external,
      # which every desktop Linux already has.
      - name: Build the command line tool
        run: swift build -c release --static-swift-stdlib
      - name: Prove the binary works
        run: |
          strip .build/release/redline
          scripts/smoke-cli.sh .build/release/redline
      - uses: actions/upload-artifact@v4
        with:
          name: redline-linux-x64
          path: .build/release/redline
          if-no-files-found: error

  core-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Swift 6.3, not 6.0: the 6.0 Windows SDK module maps predate the runner's Visual
      # Studio and send ucrt into a cycle through _visualc_intrinsics. Pinning the image to
      # windows-2022 does not help, because its MSVC is too new for 6.0 as well.
      - uses: compnerd/gha-setup-swift@v0.4.0
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
      - name: Run the core tests
        run: swift test
      - name: Build the command line tool
        run: swift build -c release
      - name: Prove the binary works
        shell: pwsh
        run: .\scripts\smoke-cli.ps1 .build\release\redline.exe
      - name: Package it with the Swift runtime
        shell: pwsh
        run: .\scripts\package-windows.ps1
      # The point of packaging is that a machine without Swift can run this, so the packaged
      # copy is proven with the toolchain taken off PATH entirely.
      - name: Prove it runs with no Swift on PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          .\scripts\smoke-cli.ps1 dist\windows\redline.exe
      - uses: actions/upload-artifact@v4
        with:
          name: redline-windows-x64
          path: dist/windows/
          if-no-files-found: error

      # The Windows shell's model layer, against the engine this job just built. Kept in this
      # job rather than its own so the two are always the same commit, and so the .NET tests
      # can invoke the real binary instead of a stub.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Test the Windows shell
        shell: pwsh
        env:
          REDLINE_TEST_BIN: ${{ github.workspace }}\dist\windows\redline.exe
        # normal verbosity, because a quiet run reports that something failed without
        # reporting what, which costs a whole CI cycle to find out
        run: dotnet test windows/RedLine.Core.Tests/RedLine.Core.Tests.csproj --nologo -v n
      # The app itself cannot be exercised headlessly, so the gate is that it compiles at all.
      # Worth having: a WinUI project breaks on package and SDK drift far more often than on
      # anything we wrote.
      - name: Build the Windows app
        shell: pwsh
        run: dotnet build windows/RedLine.App/RedLine.App.csproj -c Release -p:Platform=x64 --nologo -v m

      # Self-contained, and with the engine dropped in beside it, so what comes out of here is
      # a folder someone can download and run rather than a build that needs three installers
      # first. RedLine.Core finds the engine next to the app before it looks at PATH.
      - name: Publish the Windows app with the engine beside it
        shell: pwsh
        run: |
          dotnet publish windows/RedLine.App/RedLine.App.csproj -c Release -p:Platform=x64 `
            -r win-x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true `
            -o dist/app --nologo -v m
          Copy-Item dist/windows/* dist/app -Force
          Write-Host "published:"
          Get-ChildItem dist/app | Measure-Object -Property Length -Sum |
            ForEach-Object { "  {0} files, {1:N0} bytes" -f $_.Count, $_.Sum }
      # Compiling is a much weaker claim than starting. This launches the published app for
      # real: XAML loads, the tray icon is created, the snapshot is read and rendered, and it
      # reports what it saw before exiting. A runner with no desktop would fail here, which is
      # itself worth knowing.
      - name: Prove the app starts
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "selftest-home"
          New-Item -ItemType Directory -Force -Path (Join-Path $home_dir ".local\share\redline") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $home_dir ".claude\projects\demo") | Out-Null
          # A transcript and a live feed, not a prepared snapshot. The app starts its own
          # watcher, which republishes immediately, so planting a snapshot would only prove
          # that it can be overwritten. This proves the whole chain instead.
          $stamp = (Get-Date).ToUniversalTime().AddMinutes(-20).ToString("yyyy-MM-ddTHH:mm:ss.000Z")
          $line = '{"timestamp":"' + $stamp + '","requestId":"req_a","message":{"id":"a",' +
                  '"model":"claude-sonnet-5","usage":{"input_tokens":12000,"output_tokens":900,' +
                  '"cache_read_input_tokens":0}}}'
          [System.IO.File]::WriteAllText(
            (Join-Path $home_dir ".claude\projects\demo\session.jsonl"), $line + "`n")
          $feed = '{"updated_at":"' + (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ") +
                  '","five_hour":{"used_percentage":42,"resets_at":4102444800}}'
          [System.IO.File]::WriteAllText(
            (Join-Path $home_dir ".local\share\redline\claude-usage.json"), $feed)
          $env:REDLINE_HOME = $home_dir
          $log = Join-Path $env:RUNNER_TEMP "selftest.log"
          $env:REDLINE_SELFTEST_LOG = $log
          Remove-Item $log -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath dist\app\RedLine.App.exe -ArgumentList "--selftest" `
                             -PassThru
          if (-not $p.WaitForExit(60000)) {
            $p.Kill($true)
            throw "the app never exited; it hung during startup"
          }
          if (Test-Path $log) { Write-Host ("report: " + (Get-Content $log -Raw)) }
          else { Write-Host "report: (none written)" }
          if ($p.ExitCode -ne 0) { throw "the app exited $($p.ExitCode)" }
          $report = Get-Content $log -Raw
          if ($report -notmatch "^ok:") { throw "self test did not report ok: $report" }
          # It read the fixture we planted, so the whole path from disk to screen ran
          # 42% is the planted feed, arriving through the watcher the app started
          if ($report -notmatch "title=42%") { throw "the app did not render the reading: $report" }
          if ($report -notmatch "windows=1") { throw "the limit window never appeared: $report" }
          # A tray app whose icon failed to load is not a tray app
          if ($report -notmatch "tray=created") { throw "the tray icon was never created: $report" }
          # The app has to keep its own data current, not wait for someone to run the watcher
          if ($report -notmatch "engine=running") { throw "the app did not start the engine: $report" }
          # The settings page built a control for every setting the engine published. A page
          # that renders nothing looks exactly like one that rendered fine.
          # Matched explicitly: -notmatch does not reliably populate $Matches
          $built = [regex]::Match($report, "settings=(-?\d+)")
          if (-not $built.Success) { throw "the settings page never built: $report" }
          if ([int]$built.Groups[1].Value -lt 12) {
            throw "the settings page built too little: $report"
          }
          # The dashboard drew. Zero bars is honest here, because the watcher may not have
          # ingested by the time the feed has already produced a reading; a negative means
          # the page threw, and the digits below will not match it.
          if ($report -notmatch "dashboard=\d+") { throw "the dashboard never built: $report" }
          # Notifications registered and one actually posted. Registering is the half that
          # can fail on an unpackaged app; showing is the half that proves the path.
          if ($report -notmatch "toasts=registered") { throw "toasts did not register: $report" }
          if ($report -notmatch "posted=[1-9]") { throw "no toast was delivered: $report" }

      # MSIX is the only packaging that gives a real install and uninstall, and the only one
      # that can carry the Windows 11 widget. Signed here with a throwaway certificate purely
      # so this job can install it: a package nobody can install is not a package, and the
      # manifest is where that goes wrong.
      - name: Build the MSIX
        shell: pwsh
        run: |
          dotnet publish windows/RedLine.App/RedLine.App.csproj -c Release -p:Platform=x64 `
            -r win-x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true `
            -p:WindowsPackageType=MSIX -p:GenerateAppxPackageOnBuild=true `
            -p:AppxPackageSigningEnabled=false -p:AppxBundle=Never `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxPackageDir="$env:GITHUB_WORKSPACE\dist\msix\" `
            -p:RedlineEngine="$env:GITHUB_WORKSPACE\dist\windows" `
            --nologo -v m
          $package = Get-ChildItem -Recurse -Filter *.msix "$env:GITHUB_WORKSPACE\dist" |
                     Select-Object -First 1
          if (-not $package) {
            Write-Host "nothing matching *.msix; here is what the build produced:"
            Get-ChildItem -Recurse "$env:GITHUB_WORKSPACE\dist\msix" -ErrorAction SilentlyContinue |
              ForEach-Object { "  " + $_.FullName }
            throw "the packaged build produced no .msix"
          }
          "  {0} ({1:N0} bytes)" -f $package.Name, $package.Length
          "MSIX=$($package.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The certificate is generated here and thrown away with the runner. Its subject has to
      # match the manifest's Publisher exactly or the package will not install.
      - name: Sign and install it
        shell: pwsh
        run: |
          $subject = "CN=Prashanth Goriparthi"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $subject `
                    -KeyUsage DigitalSignature -CertStoreLocation "Cert:\CurrentUser\My" `
                    -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $password = ConvertTo-SecureString -String "redline-ci" -Force -AsPlainText
          $pfx = Join-Path $env:RUNNER_TEMP "redline-ci.pfx"
          Export-PfxCertificate -Cert $cert -FilePath $pfx -Password $password | Out-Null
          # Trusted, or Windows refuses a package it cannot chain to anything
          Import-PfxCertificate -FilePath $pfx -Password $password `
            -CertStoreLocation Cert:\LocalMachine\TrustedPeople | Out-Null

          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object FullName | Select-Object -Last 1
          if (-not $signtool) { throw "no signtool on this runner" }
          & $signtool.FullName sign /fd SHA256 /f $pfx /p "redline-ci" $env:MSIX
          if ($LASTEXITCODE -ne 0) { throw "signing failed" }

          Add-AppxPackage -Path $env:MSIX
          $installed = Get-AppxPackage Goriparthi.RedLine
          if (-not $installed) { throw "the package did not install" }
          Write-Host ("installed " + $installed.PackageFullName)
          "PACKAGE_ROOT=$($installed.InstallLocation)" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PACKAGE_FULL=$($installed.PackageFullName)" | Out-File -FilePath $env:GITHUB_ENV -Append

      # The same self test, from the installed copy. Proves the manifest, the payload and the
      # engine beside it, not just that a file was produced.
      - name: Prove the installed app starts
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "msix-home"
          New-Item -ItemType Directory -Force -Path (Join-Path $home_dir ".local\share\redline") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $home_dir ".claude\projects\demo") | Out-Null
          $feed = '{"updated_at":"' + (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ") +
                  '","five_hour":{"used_percentage":42,"resets_at":4102444800}}'
          [System.IO.File]::WriteAllText(
            (Join-Path $home_dir ".local\share\redline\claude-usage.json"), $feed)

          # A feed and no transcript, so this run reports dashboard=0 where the unpackaged one
          # above reports 14. That is the honest answer for a home with no history in it, not
          # a difference between the two builds.
          $env:REDLINE_HOME = $home_dir
          $log = Join-Path $env:RUNNER_TEMP "msix-selftest.log"
          $env:REDLINE_SELFTEST_LOG = $log
          Remove-Item $log -ErrorAction SilentlyContinue

          $exe = Join-Path $env:PACKAGE_ROOT "RedLine.App.exe"
          if (-not (Test-Path $exe)) {
            Get-ChildItem $env:PACKAGE_ROOT | ForEach-Object { "  " + $_.Name }
            throw "no RedLine.App.exe in the installed package"
          }
          $p = Start-Process -FilePath $exe -ArgumentList "--selftest" -PassThru
          if (-not $p.WaitForExit(60000)) {
            $p.Kill($true)
            throw "the installed app never exited"
          }
          if (Test-Path $log) { Write-Host ("report: " + (Get-Content $log -Raw)) }
          else { throw "the installed app wrote no report" }
          $report = Get-Content $log -Raw
          if ($report -notmatch "^ok:") { throw "the installed app did not report ok: $report" }
          # The engine has to be inside the package, or the app is an empty window
          if ($report -notmatch "engine=running") { throw "no engine inside the package: $report" }
          if ($report -notmatch "title=42%") { throw "the installed app read nothing: $report" }

      - name: Uninstall it again
        if: always()
        shell: pwsh
        run: |
          if ($env:PACKAGE_FULL) {
            Remove-AppxPackage -Package $env:PACKAGE_FULL
            if (Get-AppxPackage Goriparthi.RedLine) { throw "the package would not uninstall" }
            Write-Host "uninstalled cleanly"
          }

      # What Store certification runs, so a rejection costs a CI run rather than a submission
      # round trip. Off by default because it takes minutes and a submission is rare: dispatch
      # the workflow with wack=true before sending one. The binaries worth watching are the
      # Swift ones, which are not built with the flags the binary analyzer looks for.
      - name: Windows App Certification Kit
        if: ${{ inputs.wack }}
        shell: pwsh
        run: |
          $appcert = "C:\Program Files (x86)\Windows Kits\10\App Certification Kit\appcert.exe"
          if (-not (Test-Path $appcert)) {
            throw "no App Certification Kit on this runner; it ships with the Windows SDK"
          }
          $report = Join-Path $env:RUNNER_TEMP "wack.xml"
          & $appcert reset | Out-Null
          & $appcert test -appxpackagepath $env:MSIX -reportoutputpath $report
          if (-not (Test-Path $report)) { throw "the kit wrote no report" }

          $xml = [xml](Get-Content $report)
          $overall = $xml.REPORT.OVERALL_RESULT
          Write-Host "overall: $overall"
          $xml.SelectNodes("//TEST[@RESULT='FAIL']") | ForEach-Object {
            Write-Host ("FAIL  " + $_.NAME)
            $_.SelectNodes(".//MESSAGE") | ForEach-Object { Write-Host ("      " + $_.InnerText) }
          }
          if ($overall -ne "PASS") { throw "the certification kit says $overall" }

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.wack }}
        with:
          name: redline-wack-report
          path: ${{ runner.temp }}/wack.xml
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: redline-windows-app-x64
          path: dist/app/
          if-no-files-found: error

      # Unsigned on purpose: the CI certificate is a throwaway and signing it with one would
      # hand out a package that only trusts a key nobody has. It is here to be inspected, and
      # to be signed for real once there is a certificate.
      - uses: actions/upload-artifact@v4
        with:
          name: redline-windows-msix-x64-unsigned
          path: dist/msix/
          if-no-files-found: error
