name: CI

# This workflow decides WHEN the checks run. What they are lives in scripts/ci.sh, so a
# laptop and a runner execute the identical code path and a CI failure can be reproduced
# with `make ci` rather than by pushing another commit.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # macOS runner: the app links AppKit and the tests need XCTest from Xcode
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Run the check suite
        run: make ci

      # Kept as its own step so a failure here is obviously about the release gate rather
      # than about the build. Notes are required to release and only warned about here.
      - name: Release notes
        run: scripts/check-notes.sh --allow-missing

  # RedlineCore is Foundation only and has to keep building where there is no Xcode. These
  # jobs are the gate: a macOS-only API landing in the core fails here, not in a port months
  # later. Neither runner builds the app, because the app is AppKit and always will be.
  # Both publish the command line binary as an artifact, so "it builds" is something you can
  # download and run rather than something a log claims.
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Run the core tests
        run: swift test
      # Static, because a dynamically linked build needs the Swift runtime installed and
      # nobody downloading a CLI wants to install a toolchain first. libcurl stays external,
      # which every desktop Linux already has.
      - name: Build the command line tool
        run: swift build -c release --static-swift-stdlib
      - name: Prove the binary works
        run: |
          strip .build/release/redline
          scripts/smoke-cli.sh .build/release/redline
      - uses: actions/upload-artifact@v4
        with:
          name: redline-linux-x64
          path: .build/release/redline
          if-no-files-found: error

  core-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # Swift 6.3, not 6.0: the 6.0 Windows SDK module maps predate the runner's Visual
      # Studio and send ucrt into a cycle through _visualc_intrinsics. Pinning the image to
      # windows-2022 does not help, because its MSVC is too new for 6.0 as well.
      - uses: compnerd/gha-setup-swift@v0.4.0
        with:
          branch: swift-6.3.3-release
          tag: 6.3.3-RELEASE
      - name: Run the core tests
        run: swift test
      - name: Build the command line tool
        run: swift build -c release
      - name: Prove the binary works
        shell: pwsh
        run: .\scripts\smoke-cli.ps1 .build\release\redline.exe
      - name: Package it with the Swift runtime
        shell: pwsh
        run: .\scripts\package-windows.ps1
      # The point of packaging is that a machine without Swift can run this, so the packaged
      # copy is proven with the toolchain taken off PATH entirely.
      - name: Prove it runs with no Swift on PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot"
          .\scripts\smoke-cli.ps1 dist\windows\redline.exe
      - uses: actions/upload-artifact@v4
        with:
          name: redline-windows-x64
          path: dist/windows/
          if-no-files-found: error

      # The Windows shell's model layer, against the engine this job just built. Kept in this
      # job rather than its own so the two are always the same commit, and so the .NET tests
      # can invoke the real binary instead of a stub.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: Test the Windows shell
        shell: pwsh
        env:
          REDLINE_TEST_BIN: ${{ github.workspace }}\dist\windows\redline.exe
        # normal verbosity, because a quiet run reports that something failed without
        # reporting what, which costs a whole CI cycle to find out
        run: dotnet test windows/RedLine.Core.Tests/RedLine.Core.Tests.csproj --nologo -v n
      # The app itself cannot be exercised headlessly, so the gate is that it compiles at all.
      # Worth having: a WinUI project breaks on package and SDK drift far more often than on
      # anything we wrote.
      - name: Build the Windows app
        shell: pwsh
        run: dotnet build windows/RedLine.App/RedLine.App.csproj -c Release -p:Platform=x64 --nologo -v m

      # Self-contained, and with the engine dropped in beside it, so what comes out of here is
      # a folder someone can download and run rather than a build that needs three installers
      # first. RedLine.Core finds the engine next to the app before it looks at PATH.
      - name: Publish the Windows app with the engine beside it
        shell: pwsh
        run: |
          dotnet publish windows/RedLine.App/RedLine.App.csproj -c Release -p:Platform=x64 `
            -r win-x64 -p:SelfContained=true -p:WindowsAppSDKSelfContained=true `
            -o dist/app --nologo -v m
          Copy-Item dist/windows/* dist/app -Force
          Write-Host "published:"
          Get-ChildItem dist/app | Measure-Object -Property Length -Sum |
            ForEach-Object { "  {0} files, {1:N0} bytes" -f $_.Count, $_.Sum }
      # Compiling is a much weaker claim than starting. This launches the published app for
      # real: XAML loads, the tray icon is created, the snapshot is read and rendered, and it
      # reports what it saw before exiting. A runner with no desktop would fail here, which is
      # itself worth knowing.
      - name: Prove the app starts
        shell: pwsh
        run: |
          $home_dir = Join-Path $env:RUNNER_TEMP "selftest-home"
          New-Item -ItemType Directory -Force -Path (Join-Path $home_dir ".local\share\redline") | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $home_dir ".claude\projects\demo") | Out-Null
          Copy-Item windows/RedLine.Core.Tests/fixtures/snapshot-headless.json `
            (Join-Path $home_dir ".local\share\redline\snapshot.json")
          $env:REDLINE_HOME = $home_dir
          $log = Join-Path $env:RUNNER_TEMP "selftest.log"
          $env:REDLINE_SELFTEST_LOG = $log
          Remove-Item $log -ErrorAction SilentlyContinue

          $p = Start-Process -FilePath dist\app\RedLine.App.exe -ArgumentList "--selftest" `
                             -PassThru
          if (-not $p.WaitForExit(60000)) {
            $p.Kill($true)
            throw "the app never exited; it hung during startup"
          }
          if (Test-Path $log) { Write-Host ("report: " + (Get-Content $log -Raw)) }
          else { Write-Host "report: (none written)" }
          if ($p.ExitCode -ne 0) { throw "the app exited $($p.ExitCode)" }
          $report = Get-Content $log -Raw
          if ($report -notmatch "^ok:") { throw "self test did not report ok: $report" }
          # It read the fixture we planted, so the whole path from disk to screen ran
          if ($report -notmatch "windows=3") { throw "the app did not render the snapshot: $report" }
          # A tray app whose icon failed to load is not a tray app
          if ($report -notmatch "tray=created") { throw "the tray icon was never created: $report" }
          # The app has to keep its own data current, not wait for someone to run the watcher
          if ($report -notmatch "engine=running") { throw "the app did not start the engine: $report" }

      - uses: actions/upload-artifact@v4
        with:
          name: redline-windows-app-x64
          path: dist/app/
          if-no-files-found: error
